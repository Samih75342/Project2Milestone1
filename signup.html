
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiCloset - Get Started</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="signup-page">

    <header class="signup-header">
        <h1>DigiCloset</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="signup.html">Get Started</a>
            <a href="generator.html">Generator</a>
        </nav>
    </header>

    <main class="signup-container">

        <h2>Let's Get You Started</h2>

        <div class="signup-content">

            <form class="signup-form" action="#" method="post">

                <div class="form-field">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name"
                           name="first-name"
                           placeholder="ENTER FIRST NAME..."
                           required>
                </div>

                <div class="form-field">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name"
                           name="last-name"
                           placeholder="ENTER LAST NAME..."
                           required>
                </div>

                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username"
                           name="username"
                           placeholder="CREATE USERNAME..."
                           required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                           name="password"
                           placeholder="CREATE PASSWORD..."
                           required>
                </div>

                <div class="form-field">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password"
                           name="confirm-password"
                           placeholder="RE-ENTER PASSWORD..."
                           required>
                </div>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    I agree to the terms and conditions
                </label>

                <button type="submit" class="signup-button">
                    Create My Account
                </button>

                <p class="login-link">
                    Already Have An Account?
                    <a href="index.html">Log In</a>
                </p>

            </form>

            <section class="signup-art" aria-label="DigiCloset fashion illustration">
                <h3>DigiCloset</h3>
                <img src="images/mannequin.png"
                     alt="Fashion mannequin illustration">
            </section>

        </div>
    </main>

    <footer class="signup-footer">
        DigiCloset - Your Personal Outfit Stylist
    </footer>

</body>
</html>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/signup.css">
